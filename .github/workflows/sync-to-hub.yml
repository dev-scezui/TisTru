name: Sync to Hugging Face Hub

on:
  push:
    branches: [main] # Change to master if your default branch is master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Add the Hugging Face Space as a remote repo
          # Replace YOUR_HF_USERNAME and YOUR_SPACE_NAME with your actual info
          git remote add space https://.:$HF_TOKEN@huggingface.co/spaces/dev-scezui/tistru

          # 2. Force push the main branch to Hugging Face's main branch
          git push --force space main
