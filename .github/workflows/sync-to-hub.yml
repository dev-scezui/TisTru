name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        uses: huggingface/huggingface-hub-action@main
        with:
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_id: dev-scezui/tistru
          repo_type: space
